name: Brisanje izdanja (jednokratno)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/obrisi-izdanja.yml
permissions:
  contents: write
jobs:
  obrisi:
    runs-on: ubuntu-latest
    steps:
      - name: Obriši izdanja 1.12.0 i 1.12.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v1.12.0 v1.12.1; do
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          done
