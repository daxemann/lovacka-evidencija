name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bilješke iz CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          PREV="${PREV#v}"
          {
            if [ -n "$PREV" ]; then echo "Promjene od $PREV do $VER."; echo; fi
            echo '**Nadogradnja:** prepisati programske datoteke (`podaci/` i `config.php` ostaju); baza se sama proširuje.'
            echo; echo '---'; echo
            awk -v v="$VER" -v p="$PREV" '
              /^## / { split($2, a, " "); cur=a[1]; if (cur==p) exit; if (cur==v) on=1 }
              on { sub(/^## /, "### "); print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
